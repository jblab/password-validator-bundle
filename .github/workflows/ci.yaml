name: CI
on:
  push:
  pull_request:
  workflow_dispatch: # allows manual trigger
  schedule: # periodically verify if everything still passes
    - cron: '0 0 1,16 * *'

jobs:
  test-coverage:
    uses: jblab/github-workflows/.github/workflows/phpunit-coverage.yaml@main
    with:
      publish-summary: true

  test:
    uses: jblab/github-workflows/.github/workflows/phpunit.yaml@main
    with:
      publish-summary: true
      phpunit-lowest-fix: 9.6.13

  phplint:
    uses: jblab/github-workflows/.github/workflows/phplint.yaml@main
    with:
      php: 8.1
      extra-args: src tests

  phpcs:
    uses: jblab/github-workflows/.github/workflows/phpcs.yaml@main
    with:
      php: 8.1

  phpstan:
    uses: jblab/github-workflows/.github/workflows/phpstan.yaml@main
    with:
      php: 8.1
      install-phpunit-bridge: true
